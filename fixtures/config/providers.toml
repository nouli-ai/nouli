default_provider = "jev"
default_model = "jev-latest"
output = "auto"

[execution]
max_parallel = 4
max_attempts = 3
attempt_timeout_seconds = 120

[providers.jev]
protocol = "system-one"
base_url = "https://api.typesafe.ai"
api_key_env = "TYPESAFE_API_KEY"

[providers.jev.models."jev-latest"]

[providers.openai]
protocol = "openai-decisions"
base_url = "https://api.openai.com"
api_key_env = "OPENAI_API_KEY"

[providers.openai.models."gpt-6-luna"]

[providers.router]
protocol = "system-one"
base_url = "https://openrouter.ai/api"
api_key_env = "OPENROUTER_API_KEY"

[providers.router.models."openai/gpt-6-luna-decisions"]

[providers.local]
protocol = "system-one"
base_url = "http://localhost:8000"

[providers.local.models."english"]
context_budget_tokens = 512

[providers.custom]
protocol = "openai-decisions"
base_url = "https://decisions.example.net/prefix"
api_key_env = "CUSTOM_KEY"

[providers.custom.models."custom-decision-model"]
context_budget_tokens = 8192
