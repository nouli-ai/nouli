[package]
name = "nouli-core"
description = "Rust library for Nouli, a ledger-backed decision network that records AI decisions and connects them to the facts and earlier answers they use."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["science::ml"]

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
httpdate = "1.0.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-value = "0.7.0"
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "test-util"] }
tokio-util = "0.7.20"
toml = "1.1.8"
toon-format = { version = "0.7.0", default-features = false }
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v7", "serde"] }

