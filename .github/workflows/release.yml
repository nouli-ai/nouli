name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    name: Check version and changelog
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tag matches version and belongs to main
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$version" = "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)"
          git merge-base --is-ancestor HEAD origin/main
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Extract release notes from changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$(awk -v version="$VERSION" '$1=="##" {gsub(/\[|\]/,"",$2); if($2==version) n++} END {print n+0}' CHANGELOG.md)" = 1
          awk -v version="$VERSION" '
            $1=="##" {gsub(/\[|\]/,"",$2); if($2==version) {capture=1; next} if(capture) exit}
            capture && /^\[[^][]+\]:/ {exit}
            capture {print}
          ' CHANGELOG.md > release-notes.md
          grep -q '^[[:space:]]*[-*] ' release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - name: Install release target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Configure Windows native build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvm = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (!(Test-Path (Join-Path $llvm 'clang-cl.exe'))) { throw 'LLVM clang-cl is required' }
          $llvm >> $env:GITHUB_PATH
          'RUSTFLAGS=-C target-feature=+crt-static' >> $env:GITHUB_ENV
          if ($env:RUNNER_ARCH -eq 'X64') {
            if (!(Get-Command nasm -ErrorAction SilentlyContinue)) { choco install nasm --no-progress -y; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
            (Join-Path $env:ProgramFiles 'NASM') >> $env:GITHUB_PATH
          }
      - name: Test release commit
        if: matrix.target == 'aarch64-unknown-linux-gnu' || runner.os == 'Windows'
        run: cargo test --workspace --locked -- --test-threads=4
      - name: Build release binary and terminal fixture
        run: cargo build --package nouli-cli --bins --examples --release --locked
      - name: Verify Windows runtime imports
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $visualStudio = & $vswhere -latest -products '*' -property installationPath
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $reader = Get-ChildItem "$visualStudio/VC/Tools/MSVC/*/bin/Host*/*/dumpbin.exe" | Select-Object -First 1
          if (!$reader) { throw 'Visual Studio dumpbin is required to inspect release dependencies' }
          $imports = & $reader.FullName /nologo /dependents "target/$env:CARGO_BUILD_TARGET/release/nouli.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($imports -match '(?i)\b(vcruntime|msvcp|concrt)[a-z0-9_]*\.dll\b') { throw 'Release requires a separate Visual C++ runtime' }
      - name: Check release startup and terminal cleanup
        run: cargo test --package nouli-cli --test smoke --test tui_selection --test tui_startup --release --locked -- --test-threads=4
      - name: Smoke test Unix release binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          env -i HOME="$RUNNER_TEMP/nouli-smoke" "target/$CARGO_BUILD_TARGET/release/nouli" --help
          env -i HOME="$RUNNER_TEMP/nouli-smoke" "target/$CARGO_BUILD_TARGET/release/nouli" --version
      - name: Smoke test Windows release binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:HOME = Join-Path $env:RUNNER_TEMP 'nouli-smoke'
          $binary = "target/$env:CARGO_BUILD_TARGET/release/nouli.exe"
          & $binary --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $binary --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Create Unix archive and checksum
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          archive="nouli-$VERSION-$TARGET.tar.gz"
          mkdir -p dist
          tar -czf "dist/$archive" -C "target/$TARGET/release" nouli -C "$GITHUB_WORKSPACE" LICENSE README.md
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
      - name: Create Windows archive and checksum
        if: runner.os == 'Windows'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        shell: pwsh
        run: |
          $archive = "nouli-$env:VERSION-$env:TARGET.zip"
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -LiteralPath "target/$env:TARGET/release/nouli.exe", LICENSE, README.md -DestinationPath "dist/$archive"
          $hash = (Get-FileHash -LiteralPath "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path (Get-Location) "dist/$archive.sha256"), "$hash  $archive`n", [Text.Encoding]::ASCII)
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  publish:
    name: Create draft GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes
      - name: Verify archive checksums
        run: cd dist && cat ./*.sha256 | sha256sum --check
      - name: Create draft with binaries and changelog notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft \
            --title "$GITHUB_REF_NAME" --notes-file notes/release-notes.md
