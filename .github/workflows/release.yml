name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    name: Verify tag and resolve validated artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      actions: write
    outputs:
      run: ${{ steps.candidate.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tag, locked version, and release notes
        run: bash scripts/ci/release.sh prepare "$GITHUB_REF_NAME" release-notes.md
      - name: Resolve validated main artifacts or rebuild the exact approved commit
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=$(bash scripts/ci/release.sh resolve-run "$GITHUB_SHA" "$GITHUB_REF_NAME")
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
  publish:
    name: Verify and create draft GitHub Release
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.run }}
          pattern: candidate-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: notes
      - name: Require every expected asset and verify checksums
        run: bash scripts/ci/release.sh verify dist
      - name: Create draft from validated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft \
            --title "$GITHUB_REF_NAME" --notes-file notes/release-notes.md
