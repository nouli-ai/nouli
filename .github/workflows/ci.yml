name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_all:
        description: Run all checks
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  select:
    name: Select checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ inputs.run_all || steps.filter.outputs.rust == 'true' }}
      ci: ${{ inputs.run_all || steps.filter.outputs.ci == 'true' }}
      installer: ${{ inputs.run_all || steps.filter.outputs.installer == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event_name == 'push' && github.event.before || github.event_name == 'pull_request' && github.base_ref || 'HEAD~1' }}
          filters: |
            ci: &pipeline
              - '.github/**'
            rust:
              - *pipeline
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - 'nouli-core/README.md'
              - '.cargo/**'
              - 'fixtures/**'
            installer:
              - *pipeline
              - 'scripts/install.sh'
  lint-ci:
    name: Lint workflows
    needs: select
    if: needs.select.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run Actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
  lint-installer:
    name: Lint installer
    needs: select
    if: needs.select.outputs.installer == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run ShellCheck
        run: shellcheck scripts/install.sh
  lint-rust:
    name: Lint Rust
    needs: select
    if: needs.select.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
  test:
    name: Test Rust (${{ matrix.os }})
    needs: select
    if: needs.select.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Configure Windows native build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvm = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (!(Test-Path (Join-Path $llvm 'clang-cl.exe'))) { throw 'LLVM clang-cl is required' }
          $llvm >> $env:GITHUB_PATH
          if ($env:RUNNER_ARCH -eq 'X64') {
            if (!(Get-Command nasm -ErrorAction SilentlyContinue)) { choco install nasm --no-progress -y; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
            (Join-Path $env:ProgramFiles 'NASM') >> $env:GITHUB_PATH
          }
      - name: Lint platform-specific Rust
        if: runner.os != 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run unit, integration, and example tests
        run: cargo test --workspace --all-targets --locked -- --test-threads=4
      - name: Run documentation tests
        run: cargo test --workspace --doc --locked
      - name: Verify the packaged core in an independent application
        run: cargo test -p nouli-core --test package_consumer --locked -- --ignored
      - name: Build release executables and test fixtures
        run: cargo build --workspace --bins --examples --release --locked
      - name: Verify release terminal behavior
        run: cargo test -p nouli-cli --release --locked --test smoke --test tui_selection --test tui_references --test tui_model_picker -- --test-threads=4
  docs:
    name: Build API documentation
    needs: select
    if: needs.select.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Build API documentation
        run: cargo doc --workspace --no-deps --locked
  required:
    name: Required checks
    needs: [select, lint-ci, lint-installer, lint-rust, test, docs]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected check to pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
