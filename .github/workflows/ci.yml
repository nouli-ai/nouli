name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_all:
        description: Validate every target and retain candidates for an approved main commit
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  select:
    name: Select checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ inputs.run_all || steps.filter.outputs.rust == 'true' }}
      ci: ${{ inputs.run_all || steps.filter.outputs.ci == 'true' }}
      unix: ${{ inputs.run_all || steps.filter.outputs.unix == 'true' }}
      windows: ${{ inputs.run_all || steps.filter.outputs.windows == 'true' }}
      matrix: ${{ steps.targets.outputs.matrix }}
      unix_matrix: ${{ steps.targets.outputs.unix }}
      windows_matrix: ${{ steps.targets.outputs.windows }}
      candidate: ${{ steps.targets.outputs.candidate }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.event.before || github.event_name == 'pull_request' && github.base_ref || 'HEAD~1' }}
          filters: |
            ci:
              - '.github/**'
              - 'scripts/ci/**'
            rust:
              - '.github/workflows/ci.yml'
              - '.github/workflows/validate.yml'
              - '.github/workflows/release.yml'
              - 'scripts/ci/**'
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - 'nouli-core/README.md'
              - '.cargo/**'
              - 'fixtures/**'
            unix:
              - 'scripts/install.sh'
            windows:
              - 'scripts/install.ps1'
      - name: Select targets and candidate eligibility
        id: targets
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          candidate=false
          if [[ "$EVENT" == push && "$REF" == refs/heads/main ]] || [[ "$EVENT" == workflow_dispatch ]]; then
            if git merge-base --is-ancestor HEAD origin/main; then candidate=true; fi
          fi
          {
            echo "matrix=$(jq -c '{include:.}' scripts/ci/targets.json)"
            echo "unix=$(jq -c '{include:map(select(.os == "ubuntu-24.04"))}' scripts/ci/targets.json)"
            echo "windows=$(jq -c '{include:map(select(.extension == "zip"))}' scripts/ci/targets.json)"
            echo "candidate=$candidate"
          } >> "$GITHUB_OUTPUT"
  quick:
    name: Check formatting and workflows
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check Rust formatting and release metadata
        if: needs.select.outputs.rust == 'true'
        run: |
          cargo fmt --all --check
          bash scripts/ci/release.sh check
      - name: Lint workflows
        if: needs.select.outputs.ci == 'true'
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
      - name: Lint pipeline and installer shell scripts
        run: shellcheck scripts/ci/*.sh scripts/install.sh
  test:
    name: Validate shipping targets
    needs: [select, quick]
    if: needs.select.outputs.rust == 'true'
    uses: ./.github/workflows/validate.yml
    with:
      matrix: ${{ needs.select.outputs.matrix }}
      candidate: ${{ needs.select.outputs.candidate == 'true' }}
  unix-installer:
    name: Validate Unix installer
    needs: [select, quick]
    if: needs.select.outputs.rust != 'true' && needs.select.outputs.unix == 'true'
    uses: ./.github/workflows/validate.yml
    with:
      matrix: ${{ needs.select.outputs.unix_matrix }}
      mode: unix-installer
  windows-installer:
    name: Validate Windows installer
    needs: [select, quick]
    if: needs.select.outputs.rust != 'true' && needs.select.outputs.windows == 'true'
    uses: ./.github/workflows/validate.yml
    with:
      matrix: ${{ needs.select.outputs.windows_matrix }}
      mode: windows-installer
  required:
    name: Required checks
    needs: [select, quick, test, unix-installer, windows-installer]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected check to succeed
        env:
          SELECT: ${{ needs.select.result }}
          QUICK: ${{ needs.quick.result }}
          RUST: ${{ needs.select.outputs.rust }}
          UNIX: ${{ needs.select.outputs.unix }}
          WINDOWS: ${{ needs.select.outputs.windows }}
          TEST_RESULT: ${{ needs.test.result }}
          UNIX_RESULT: ${{ needs.unix-installer.result }}
          WINDOWS_RESULT: ${{ needs.windows-installer.result }}
        run: |
          test "$SELECT" = success
          test "$QUICK" = success
          if [[ "$RUST" == true ]]; then
            test "$TEST_RESULT" = success
          else
            if [[ "$UNIX" == true ]]; then test "$UNIX_RESULT" = success; fi
            if [[ "$WINDOWS" == true ]]; then test "$WINDOWS_RESULT" = success; fi
          fi
