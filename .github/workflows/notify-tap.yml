name: Notify Homebrew tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable vMAJOR.MINOR.PATCH tag
        type: string
        required: true

permissions: {}

concurrency:
  group: notify-tap-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Authenticate the tap notification
        id: tap-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: nouli-ai
          repositories: homebrew-tap
          permission-contents: write
      - name: Notify the release updater
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          gh api --method POST repos/nouli-ai/homebrew-tap/dispatches \
            -f event_type=nouli-release-published \
            -f "client_payload[release_tag]=$RELEASE_TAG"
