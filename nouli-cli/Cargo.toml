[package]
name = "nouli-cli"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "nouli"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
nix = { version = "0.31.3", features = ["fs", "signal", "user"] }
nouli-core = { version = "0.4.0", path = "../nouli-core" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
rpassword = "7.5.4"
serde_json = "1.0.154"
shlex = "2.0.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "signal", "macros", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
url = "2.5.8"

[dev-dependencies]
rusqlite = { version = "0.41.0", features = ["bundled"] }

