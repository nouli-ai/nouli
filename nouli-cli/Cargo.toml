[package]
name = "nouli-cli"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "nouli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
nix = { version = "0.31.3", features = ["fs"] }
nouli-core = { version = "0.1.0", path = "../nouli-core" }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "signal", "macros"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"

[dev-dependencies]
rusqlite = { version = "0.41.0", features = ["bundled"] }

