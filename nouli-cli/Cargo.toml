[package]
name = "nouli-cli"
description = "Terminal app and CLI for Nouli, a ledger-backed decision network that records AI decisions and connects them to the facts and earlier answers they use."
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories = ["command-line-utilities"]

[lints]
workspace = true

[[bin]]
name = "nouli"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
calamine = "0.37.0"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
csv = "1.4.0"
dotenvy = "0.15.7"
futures-util = "0.3.34"
ignore = "0.4.34"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
nix = { version = "0.31.3", features = ["fs", "resource", "signal", "user"] }
nouli-core = { version = "0.4.3", path = "../nouli-core" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
resvg = "0.49.0"
roxmltree = "0.21.2"
rpassword = "7.5.4"
serde_json = "1.0.154"
shlex = "2.0.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "signal", "macros", "time"] }
tokio-util = "0.7.20"
toml_edit = { version = "0.25.17", features = ["serde"] }
tracing = "0.1.44"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
url = "2.5.8"
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
nix = { version = "0.31.3", features = ["term", "poll", "ioctl"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }

