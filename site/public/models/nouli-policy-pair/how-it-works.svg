<svg xmlns="http://www.w3.org/2000/svg" width="640" height="458" viewBox="0 0 640 458" role="img" aria-labelledby="title desc">
  <title id="title">How Nouli Policy Pair works</title>
  <desc id="desc">A written policy enters the extractor model to produce rules. Your information enters the evidence model for fact checks. The Nouli runtime applies the rules using those checks and returns true, false or unknown.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667872"/>
    </marker>
  </defs>
  <rect width="640" height="458" rx="20" fill="#f4f1eb"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#1d2a28">
    <text x="164" y="38" font-size="24">Written policy</text>
    <text x="476" y="38" font-size="24">Your information</text>
    <g fill="none" stroke="#667872" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M 164 50 V 74"/>
      <path d="M 476 50 V 74"/>
    </g>
    <rect x="28" y="84" width="272" height="92" rx="12" fill="#0b6e63"/>
    <rect x="340" y="84" width="272" height="92" rx="12" fill="#0b6e63"/>
    <g fill="#ffffff" font-size="26" font-weight="700">
      <text x="164" y="122">Extractor model</text>
      <text x="476" y="122">Evidence model</text>
    </g>
    <g fill="#e0f2ec" font-size="22">
      <text x="164" y="152">Reads the policy</text>
      <text x="476" y="152">Checks the evidence</text>
    </g>
    <g fill="none" stroke="#667872" stroke-width="2.5">
      <path d="M 164 176 V 214 Q 164 234 184 234 H 300 Q 320 234 320 254"/>
      <path d="M 476 176 V 214 Q 476 234 456 234 H 340 Q 320 234 320 254"/>
      <path d="M 320 254 V 266" marker-end="url(#arrow)"/>
    </g>
    <text x="225" y="218" font-size="22" fill="#4f5a57">Rules</text>
    <text x="410" y="218" font-size="22" fill="#4f5a57">Fact checks</text>
    <rect x="172" y="276" width="296" height="70" rx="12" fill="#ffffff" stroke="#b8c8c0" stroke-width="1.5"/>
    <text x="320" y="306" font-size="26" font-weight="700">Nouli runtime</text>
    <text x="320" y="332" font-size="22" fill="#4f5a57">Applies the rules</text>
    <path d="M 320 346 V 370" fill="none" stroke="#667872" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="76" y="382" width="488" height="52" rx="26" fill="#e2ece6"/>
    <text x="320" y="416" font-size="26" font-weight="700">TRUE / FALSE / UNKNOWN</text>
  </g>
</svg>
