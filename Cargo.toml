[workspace]
members = ["nouli-core", "nouli-cli"]
resolver = "3"

[workspace.package]
license = "MIT"
version = "0.4.3"
edition = "2024"
rust-version = "1.99.1"
repository = "https://github.com/nouli-ai/nouli"
homepage = "https://nouli.ai/"
readme = "README.md"
keywords = ["decision", "ledger", "llm", "ai", "history"]

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
mod_module_files = "warn"
